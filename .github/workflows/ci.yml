name: Reference checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight package and build tools
        run: python -m pip install -e ".[dev]"
      - name: Validate metadata and local links
        run: python scripts/check_repository.py
      - name: Run contract checks
        run: python scripts/check_contracts.py --json artifacts/contracts-lightweight.json
      - name: Run synthetic data example
        run: |
          python examples/synthetic_manifest.py --write artifacts/synthetic
          neuralps-validate-data artifacts/synthetic/graphs.jsonl --index artifacts/synthetic/feature_index.json
          neuralps-preflight --config configs/phase2_final_config.json
      - name: Build distributions
        run: python -m build

  torch-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CPU reference environment
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[model]"
      - name: Require all neural contracts
        run: python scripts/check_contracts.py --require-torch --json artifacts/contracts-torch.json
      - name: Exercise each pooled architecture
        run: |
          python examples/model_smoke.py --variant A
          python examples/model_smoke.py --variant C
          python examples/model_smoke.py --variant D
