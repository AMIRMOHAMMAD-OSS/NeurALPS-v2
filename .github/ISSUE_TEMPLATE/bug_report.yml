name: Bug report
description: Report a reproducible code, data-contract or documentation problem.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a command or synthetic fixture without private data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python, NumPy, PyTorch and device versions, where relevant.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: Include relevant errors and skipped tests.
