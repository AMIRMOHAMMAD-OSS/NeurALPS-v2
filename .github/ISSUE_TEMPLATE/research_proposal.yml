name: Research proposal
description: Propose a controlled experiment or a representation change.
title: "[Research] "
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and motivation
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Proposed comparison
      description: Inputs, head, label budget, split and compute controls.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision criterion
      description: What result would justify keeping or rejecting the change?
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Data requirements and expected cost
