[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralps-release"
version = "0.2.2"
description = "Portable frozen NeurALPS compatibility scoring and supervised activity readout"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "matplotlib>=3.8", "huggingface-hub>=0.28,<1"]

[project.scripts]
neuralps = "neuralps.cli:main"

[tool.setuptools.package-data]
neuralps = ["data/*.json", "data/*.html", "data/*.js"]

[tool.setuptools.packages.find]
include = ["neuralps*"]
